<cx-navigation-recovery />

<div class="wg-shell">
  @if (!bare()) {
    <cx-masthead [items]="navigation()">
      <a brand routerLink="/" aria-label="Michael Wargr — home">
        <cx-inline gap="sm" align="center">
          <img
            class="wg-logo-light"
            src="/assets/brand/mark-light.png"
            alt=""
            width="74"
            height="32"
          />
          <img
            class="wg-logo-night"
            src="/assets/brand/mark-dark.png"
            alt=""
            width="74"
            height="32"
          />
          <span class="cx-text-title-2 cx-font-bold">Michael Wargr</span>
        </cx-inline>
      </a>
    </cx-masthead>
  }

  <main class="wg-main">
    <router-outlet />
  </main>

  @if (!bare()) {
    <footer class="wg-footer">
      <div class="cx-container">
        <cx-inline justify="between" align="center">
          <span>© {{ year }} Michael Wargr</span>
          <cx-icon-button
            [icon]="night() ? 'light-mode' : 'night-mode'"
            [ariaLabel]="night() ? 'Switch to light theme' : 'Switch to night theme'"
            variant="transparent"
            size="small"
            (pressed)="toggleTheme()"
          />
        </cx-inline>
      </div>
    </footer>
  }
</div>
