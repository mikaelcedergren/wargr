<!doctype html>
<html lang="en" class="theme-night cx-corners-square">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="cx-build-id" content="__CX_BUILD_ID__" />
    <title>Wargr</title>
    <meta name="author" content="Michael Wargr" />
    <meta
      name="description"
      content="Videos and stories by Michael Wargr on philosophy, ethics, and human nature."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon.png" />
    <link
      rel="icon"
      type="image/png"
      href="/assets/brand/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Wargr — stories by Michael Wargr"
      href="/feed.xml"
    />
    <!-- Apply the reader's saved theme before first paint so the page never flashes. Night is the default. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('wg-theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('theme-night');
          document.documentElement.classList.add('theme-light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <wg-root></wg-root>
  </body>
</html>
